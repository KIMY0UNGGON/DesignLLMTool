[package]
name = "designllm-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "DesignLLMTool protocol client, IPC framing, and attach-only MCP stdio bridge"

[dependencies]
designllm-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# Pinned: decoding asset.read chunks (RFC 4648 standard alphabet). MIT OR Apache-2.0, MSRV 1.48.
base64 = "=0.22.1"

[target.'cfg(windows)'.dependencies]
# Pinned: Win32 named pipes (overlapped I/O, current-user DACL, client identity). MIT OR Apache-2.0, MSRV 1.71.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
