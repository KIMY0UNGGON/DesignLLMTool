[package]
name = "designllm-web-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Rust WebView2 host. Windows only. No runtime is installed or downloaded by this crate.
# windows 0.62.2 (MIT OR Apache-2.0, declared MSRV 1.82) and webview2-com 0.39.1 (MIT, declared MSRV 1.82):
# the versions the G0 hidden-host probe built and ran against (installed Evergreen 157.0.4341.46).
[dependencies]
# base64 0.22.1 (MIT OR Apache-2.0, MSRV 1.48; already in Cargo.lock) decodes the bounded WebView2 PNG message.
base64 = "=0.22.1"
designllm-contracts.workspace = true
# Existing workspace SHA-256 dependency (already locked); hashes bounded video input incrementally with cancel checks.
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
# Features added by task 33 (A19) on the same windows 0.62.2 crate: no new crate, MSRV and license unchanged, nothing
# new to ship. Win32_System_JobObjects, Win32_Security, Win32_System_IO and Win32_System_Threading: the preview Job
# Object (memory cap, completion-port notice, ending its processes). Win32_System_Com_StructuredStorage: the in-memory
# stream that serves preview documents with their Content-Security-Policy header.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

[target.'cfg(unix)'.dependencies]
# Process liveness for stale temporary files (kill with signal 0). MIT OR Apache-2.0.
libc = "0.2"
