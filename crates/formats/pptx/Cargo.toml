[package]
name = "designllm-pptx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "PresentationML (PPTX) codec: preserving open, edit, verify, and create for DesignLLMTool"

[dependencies]
designllm-contracts.workspace = true
designllm-package.workspace = true
# Font-name matching (`face_matches_family`) for the substitution report of PPTX export.
